appConfig {
    autoGenerateJavaClassForProtoFiles = 'y'
    rest = 'y'
    security = ['form', 'jwt']
    persistence = ['springData', 'hibernate']
    dataBase = ['couchbase', 'postgres', 'mysql']
    logging = 'y'
    grpc = 'y'
    keyvaluestore = 'y'
    modelMapper = 'y'
    search = 'y'
    cache = 'y'
    queue = 'y'
    serviceDiscoveryClient = 'consul'
    beanValidation = 'y'
    identityManager {
        idmName = UAA
    }
    web = 'y'
}

dependencies {
    runtimeOnly 'org.apache.logging.log4j:log4j-layout-template-json:2.24.0'
}
